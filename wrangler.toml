# Cloudflare Pages configuration for Fusion Food Family Lab.

name = "fusionfood"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "foodfusionweb"
database_id = "af600698-1afa-4b2f-8684-82bdf975b554"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Fusion Food Family Lab"
CORS_ORIGIN = "https://fusionfood-383.pages.dev"
CORS_ALLOWED_ORIGINS = ""
