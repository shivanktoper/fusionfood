# Standalone API-only Cloudflare Worker.
# The public website is hosted by Pages; this Worker publishes no static files.

name = "foodfusionweb"
main = "worker/index.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "foodfusionweb"
database_id = "2cd5a387-170d-46a1-895c-c24deb2f5312"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Fusion Food Family Lab"
CORS_ORIGIN = "https://fusionfood-383.pages.dev"
CORS_ALLOWED_ORIGINS = ""
