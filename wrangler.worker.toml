# Standalone API-only Cloudflare Worker.
# The public website is hosted by Pages; this Worker publishes no static files.

name = "foodfusionweb"
main = "worker/index.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "foodfusionweb"
database_id = "af600698-1afa-4b2f-8684-82bdf975b554"

[vars]
ENVIRONMENT = "production"
APP_NAME = "Fusion Food Family Lab"
CORS_ORIGIN = "https://fusionfood-383.pages.dev"
CORS_ALLOWED_ORIGINS = ""
